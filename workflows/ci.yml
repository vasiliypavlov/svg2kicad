name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Smoke test — конвертация примера
        run: |
          python svg2kicad.py input.svg output.kicad_pcb --debug

      - name: Проверка, что файл создан
        run: |
          test -s output.kicad_pcb
          grep -q "(kicad_pcb" output.kicad_pcb
          echo "OK: output.kicad_pcb создан и валиден"