<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="60mm" height="40mm" viewBox="0 0 60 40">

  <g inkscape:groupmode="layer" inkscape:label="Edge.Cuts">
    <rect id="outline" x="2" y="2" width="56" height="36"
          fill="none" stroke="#000000" stroke-width="0.1"/>
  </g>

  <g inkscape:groupmode="layer" inkscape:label="THT">
    <g id="pad_left">
      <circle id="pad_left_drill" cx="10" cy="20" r="0.4" fill="#000000"/>
      <circle id="pad_left_pad" cx="10" cy="20" r="1.2" fill="#ff0000"/>
    </g>
    <g id="pad_right">
      <circle id="pad_right_drill" cx="50" cy="20" r="0.4" fill="#000000"/>
      <circle id="pad_right_pad" cx="50" cy="20" r="1.2" fill="#ff0000"/>
    </g>
  </g>

  <g inkscape:groupmode="layer" inkscape:label="F.Rule">
    <rect id="frule1" x="20" y="10" width="20" height="20"
          fill="none" stroke="#ff0000"/>
  </g>

  <g inkscape:groupmode="layer" inkscape:label="B.Rule">
    <rect id="brule1" x="20" y="10" width="20" height="20"
          fill="none" stroke="#ff0000"/>
  </g>

</svg>