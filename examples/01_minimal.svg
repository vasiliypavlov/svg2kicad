<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="50mm" height="40mm" viewBox="0 0 50 40">

  <g inkscape:groupmode="layer" inkscape:label="Edge.Cuts">
    <rect id="outline" x="2" y="2" width="46" height="36"
          fill="none" stroke="#000000" stroke-width="0.1"/>
  </g>

  <g inkscape:groupmode="layer" inkscape:label="THT">
    <g id="tht1">
      <circle id="tht1_drill" cx="15" cy="15" r="0.4" fill="#000000"/>
      <circle id="tht1_pad" cx="15" cy="15" r="1.5" fill="#ff0000"
              inkscape:label="NetVCC"/>
    </g>
  </g>

  <g inkscape:groupmode="layer" inkscape:label="F.Pad">
    <circle id="smd_f1" cx="35" cy="15" r="1.2" fill="#00ff00"/>
    <circle id="via1_top" cx="25" cy="25" r="0.6"
            fill="none" stroke="#0000ff" stroke-width="0.15"/>
  </g>

  <g inkscape:groupmode="layer" inkscape:label="B.Pad">
    <circle id="smd_b1" cx="35" cy="25" r="1.2" fill="#00ff00"/>
    <circle id="via1_bot" cx="25" cy="25" r="0.6"
            fill="none" stroke="#0000ff" stroke-width="0.15"/>
  </g>

</svg>