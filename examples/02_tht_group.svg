<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="40mm" height="30mm" viewBox="0 0 40 30">

  <g inkscape:groupmode="layer" inkscape:label="Edge.Cuts">
    <rect id="outline" x="2" y="2" width="36" height="26"
          fill="none" stroke="#000000" stroke-width="0.1"/>
  </g>

  <g inkscape:groupmode="layer" inkscape:label="THT">
    <g id="connector_j1">
      <!-- Drill -->
      <circle id="j1_drill" cx="20" cy="15" r="0.5" fill="#000000"/>
      <!-- Pad -->
      <circle id="j1_pad" cx="20" cy="15" r="2" fill="#ff8800"
              inkscape:label="NetSIG"/>
      <!-- Silk: рамка вокруг пада -->
      <rect id="j1_silk" x="14" y="9" width="12" height="12"
            fill="none" stroke="#ffffff" stroke-width="0.2"/>
      <!-- Silk: текст (Object to Path) -->
      <path id="j1_label"
            d="M 17.5 6.2 L 17.0 5.0 L 16.5 6.2 Z M 17.1 5.4 L 16.9 5.4 L 16.9 5.8 Z"
            fill="#ffffff"/>
    </g>
  </g>

</svg>